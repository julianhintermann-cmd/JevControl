<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Frames – Muster AG</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      iframe { position: absolute; }
      #fremd { left: 50px; top: 100px; width: 400px; height: 200px; border: 5px solid #4f46e5; padding: 7px; }
      #kaputt { left: 520px; top: 100px; width: 200px; height: 100px; }
      #leer { left: 50px; top: 360px; width: 300px; height: 120px; }
      #versteckt { display: none; }
    </style>
  </head>
  <body>
    <h1>Eingebettete Inhalte</h1>
    <input aria-label="Suche" />
    <!-- cross-origin (out-of-process) frame with border + padding -->
    <iframe id="fremd" title="Fremd" src="{{ALT_ORIGIN}}/danke.html"></iframe>
    <!-- frame that fails to load (error page): must be skipped silently -->
    <iframe id="kaputt" title="Kaputt" src="http://127.0.0.1:1/"></iframe>
    <!-- about:blank frame filled by script -->
    <iframe id="leer" title="Leer"></iframe>
    <!-- frame hidden via display:none: its elements are invisible -->
    <iframe id="versteckt" title="Versteckt" srcdoc="<input aria-label='Versteckt im Frame'>"></iframe>
    <script>
      const doc = document.getElementById('leer').contentDocument;
      doc.body.style.margin = '0';
      doc.body.innerHTML = '<input aria-label="Im leeren Frame">';
    </script>
  </body>
</html>
