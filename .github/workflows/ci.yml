name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test Kairo.Core
        run: dotnet test tests/Kairo.Core.Tests/Kairo.Core.Tests.csproj -c Release --logger "trx;LogFileName=core.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: TestResults

  extension:
    name: Browser extension tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
      - name: Lint and test
        working-directory: tests/extension
        run: |
          npm run lint
          npm test

  windows:
    name: Windows build, integration & E2E tests, installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Environment
        shell: pwsh
        run: |
          dotnet --info | Select-Object -First 20
          [Environment]::OSVersion
          "Interactive: $([Environment]::UserInteractive)"
          Get-CimInstance Win32_VideoController | Select-Object Name, CurrentHorizontalResolution, CurrentVerticalResolution

      - name: Build solution
        run: dotnet build Kairo.sln -c Release

      - name: Core tests
        run: dotnet test tests/Kairo.Core.Tests/Kairo.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core-windows.trx" --results-directory TestResults

      - name: Windows integration tests (UI Automation, DPAPI, hotkeys, capture, overlay)
        run: dotnet test tests/Kairo.Windows.Tests/Kairo.Windows.Tests.csproj -c Release --no-build --logger "trx;LogFileName=windows.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: End-to-end tests (agent loop on a native form and in Microsoft Edge)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: dotnet test tests/Kairo.E2E.Tests/Kairo.E2E.Tests.csproj -c Release --no-build --logger "trx;LogFileName=e2e.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: UI screenshots (light/dark)
        if: always()
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/Kairo.App/bin/Release -Recurse -Filter Kairo.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList "--screenshots", "$PWD/artifacts/screenshots" -PassThru -Wait
          "exit code: $($p.ExitCode)"
          Get-ChildItem artifacts/screenshots -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          if (Test-Path artifacts/screenshots/error.txt) { Get-Content artifacts/screenshots/error.txt | Write-Host }
          if ($p.ExitCode -ne 0) { throw "Screenshot mode failed with exit code $($p.ExitCode)" }

      - name: Build installer (publish self-contained + WiX MSI)
        shell: pwsh
        run: ./installer/build.ps1 -Configuration Release -Version "1.0.${{ github.run_number }}"

      - name: Sign installer (only if a code signing certificate is configured)
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match 'x64' | Select-Object -Last 1
          Get-ChildItem artifacts/installer -Filter *.msi | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          }
          Remove-Item $pfx

      - name: Install / uninstall test
        shell: pwsh
        run: |
          $msi = Get-ChildItem artifacts/installer -Filter *.msi | Select-Object -First 1
          ./installer/test-install.ps1 -Msi $msi.FullName

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kairo-installer
          path: artifacts/installer/*.msi
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/screenshots
          if-no-files-found: warn

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            TestResults
            artifacts/**/*.log
            *.log
          if-no-files-found: warn
